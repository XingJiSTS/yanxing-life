<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册照片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #111;
    }
    .swiper-wrap {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .img-item {
      width: 100%;
      height: 100vh;
      display: none;
    }
    .img-item.active {
      display: block;
    }
    .img-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .page-num {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="swiper-wrap" id="swiperWrap"></div>
  <div class="page-num" id="pageNum"></div>

<!-- 重点：所有JS必须放在script标签内 -->
<script>
const WORKER_URL = "https://photo.yanxing.life/";
const BUCKET_DOMAIN = "https://passer-by-image.yanxing.life";
const swiperWrap = document.getElementById("swiperWrap");
const pageNum = document.getElementById("pageNum");

let imgList = [];
let currentIndex = 0;

async function loadAlbumImages(){
  const params = new URLSearchParams(location.search);
  const albumId = params.get("albumId");

  if(!albumId){
    document.body.style.background = "#f7f9fc";
    document.body.innerHTML = `
    <div style="color:#342a2a;margin:auto;text-align:center;padding:40px 20px;font-size:20px;">
      该页面仅能通过相册二维码/图库相册图片打开<br><br>
      <a href="/" style="color:#007bff;text-decoration:none;">返回主页</a>
    </div>`;
    return;
  }

  try {
    const abortCtrl = new AbortController();
    setTimeout(() => abortCtrl.abort(), 3000);

    const res = await fetch(`${WORKER_URL}list`, {
      signal: abortCtrl,
      headers: { "Accept": "application/json" }
    });

    if (!res.ok) throw new Error("接口请求异常");
    const data = await res.json();
    const allFiles = data.files || [];
    imgList = allFiles.filter(file => file.albumId === albumId).sort((a,b)=>a.time - b.time);
    
    if(imgList.length === 0){
      document.body.style.background = "#f7f9fc";
      document.body.innerHTML = `
      <div style="color:#342a2a;margin:auto;text-align:center;padding:40px 20px;font-size:20px;">
        当前相册无图片<br><br>
        <a href="/" style="color:#007bff;text-decoration:none;">返回主页</a>
      </div>`;
      return;
    }
    renderImages();
    bindTouch();
    updatePage();
  } catch(err){
    document.body.style.background = "#f7f9fc";
    let tipText = "相册加载失败，请刷新页面";
    if(err.name === "AbortError") tipText = "加载超时，网络不佳请重试";
    document.body.innerHTML = `
    <div style="color:#342a2a;margin:auto;text-align:center;padding:40px 20px;font-size:20px;">
      ${tipText}<br><br>
      <a href="/" style="color:#007bff;text-decoration:none;">返回主页</a>
    </div>`;
    console.error("相册加载错误：", err);
  }
}

// 修复完成的渲染函数
function renderImages(){
  swiperWrap.innerHTML = "";
  imgList.forEach((item,idx)=>{
    const div = document.createElement("div");
    div.className = `img-item ${idx === 0 ? 'active' : ''}`;
    const imgSrc = `${BUCKET_DOMAIN}/${item.name}`;
    div.innerHTML = `<img src="${imgSrc}" loading="lazy">`;
    swiperWrap.appendChild(div);
  })
}

function updatePage(){
  pageNum.innerText = `${currentIndex + 1} / ${imgList.length}`;
  document.querySelectorAll(".img-item").forEach((el,idx)=>{
    el.classList.toggle("active", idx === currentIndex);
  })
}

function bindTouch(){
  let startX = 0;
  swiperWrap.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
  })
  swiperWrap.addEventListener("touchend", e=>{
    const endX = e.changedTouches[0].clientX;
    const diff = startX - endX;
    if(diff > 60 && currentIndex < imgList.length -1){
      currentIndex++;
      updatePage();
    }else if(diff < -60 && currentIndex > 0){
      currentIndex--;
      updatePage();
    }
  })
}

loadAlbumImages();
</script>
</body>
</html>
