<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>相册照片</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      background: #111;
    }
    .swiper-wrap {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    .img-item {
      width: 100%;
      height: 100vh;
      display: none;
    }
    .img-item.active {
      display: block;
    }
    .img-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .page-num {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="swiper-wrap" id="swiperWrap"></div>
  <div class="page-num" id="pageNum"></div>

  <script>
    // 权限拦截
    function checkAuth(){
      const authFlag = localStorage.getItem("photoSystemAuth");
      if(authFlag !== "pass"){
        location.href = "/auth/login";
      }
    }
    checkAuth();

    const WORKER_URL = "https://photo-upload-worker.abcd20100234.workers.dev/";
    const BUCKET_DOMAIN = "https://passer-by-image.yanxing.life";
    const swiperWrap = document.getElementById("swiperWrap");
    const pageNum = document.getElementById("pageNum");

    let imgList = [];
    let currentIndex = 0;

    // 获取当前相册所有图片
    async function loadAlbumImages(){
      const params = new URLSearchParams(location.search);
      const albumId = params.get("albumId");
      if(!albumId){
        document.body.innerHTML = '<div style="color:#fff;margin:auto;">相册链接无效</div>';
        return;
      }
      try {
        const res = await fetch(`${WORKER_URL}list`);
        const data = await res.json();
        const allFiles = data.files || [];
        // 筛选当前相册下所有图片
        imgList = allFiles.filter(file => file.albumId === albumId).sort((a,b)=>a.time - b.time);
        if(imgList.length === 0){
          document.body.innerHTML = '<div style="color:#fff;margin:auto;">相册无图片</div>';
          return;
        }
        renderImages();
        bindTouch();
        updatePage();
      } catch(err){
        document.body.innerHTML = '<div style="color:#fff;margin:auto;">相册加载失败</div>';
        console.error(err);
      }
    }

    // 渲染图片轮播
    function renderImages(){
      swiperWrap.innerHTML = "";
      imgList.forEach((item,idx)=>{
        const div = document.createElement("div");
        div.className = `img-item ${idx === 0 ? 'active' : ''}`;
        div.innerHTML = `<img src="${BUCKET_DOMAIN}/${item.name}" loading="lazy">`;
        swiperWrap.appendChild(div);
      })
    }

    // 更新页码
    function updatePage(){
      pageNum.innerText = `${currentIndex + 1} / ${imgList.length}`;
      document.querySelectorAll(".img-item").forEach((el,idx)=>{
        el.classList.toggle("active", idx === currentIndex);
      })
    }

    // 左右滑动切换
    function bindTouch(){
      let startX = 0;
      swiperWrap.addEventListener("touchstart", e=>{
        startX = e.touches[0].clientX;
      })
      swiperWrap.addEventListener("touchend", e=>{
        const endX = e.changedTouches[0].clientX;
        const diff = startX - endX;
        if(diff > 60 && currentIndex < imgList.length -1){
          currentIndex++;
          updatePage();
        }else if(diff < -60 && currentIndex > 0){
          currentIndex--;
          updatePage();
        }
      })
    }

    loadAlbumImages();
  </script>
</body>
</html>
