<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最近上传图库</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #f7f9fc;
      padding: 20px;
      font-family: system-ui;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #342a2a;
    }
    .back-btn {
      display: block;
      width: fit-content;
      margin:0 auto 30px;
      padding:10px 24px;
      border:3px solid #342a2a;
      border-radius:12px;
      text-decoration:none;
      color:#342a2a;
      font-size:20px;
    }
    /* 核心布局：网格2px间隙，无画框 */
    .gallery-wrap {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 2px; /* 仅2px方形分割间隙，无任何边框 */
      max-width:1200px;
      margin:0 auto;
    }
    .img-card {
      /* 完全移除边框、圆角画框 */
      overflow:hidden;
      background:#fff;
    }
    .img-card img {
      width:100%;
      height:140px;
      object-fit:cover;
      display:block;
    }
    .empty-tip {
      text-align:center;
      font-size:22px;
      color:#7d8797;
      margin-top:80px;
    }
  </style>
</head>
<body>
  <h1>最近上传照片</h1>
  <a href="/" class="back-btn">返回主页</a>
  <div class="gallery-wrap" id="gallery"></div>
  <div class="empty-tip" id="emptyTip">暂无上传图片</div>

  <script>
    // 权限拦截
    function checkAuth(){
        const authFlag = localStorage.getItem("photoSystemAuth");
        if(authFlag !== "pass"){
            location.href = "/auth/login";
        }
    }
    checkAuth();

    const BUCKET_DOMAIN = "https://passer-by-image.yanxing.life";
    const WORKER_URL = "https://photo-upload-worker.abcd20100234.workers.dev/";
    const galleryWrap = document.getElementById("gallery");
    const emptyTip = document.getElementById("emptyTip");

    async function loadAllImages() {
      try {
        const res = await fetch(WORKER_URL + "list");
        const data = await res.json();
        const fileList = data.files || [];

        if(fileList.length === 0) return;
        emptyTip.style.display = "none";

        // 全部图片按上传时间倒序，忽略相册分组
        fileList.sort((a,b) => b.time - a.time);

        fileList.forEach(fileItem => {
          const card = document.createElement("div");
          card.className = "img-card";
          const imgUrl = `${BUCKET_DOMAIN}/${fileItem.name}`;
          card.innerHTML = `<img src="${imgUrl}" loading="lazy">`;
          // 单图跳转原图页，相册图跳转相册页
          card.onclick = () => {
            if(fileItem.albumId){
              window.open(`/share/album?albumId=${fileItem.albumId}`, "_blank");
            }else{
              window.open(`/share/img?id=${fileItem.name}`, "_blank");
            }
          };
          galleryWrap.appendChild(card);
        })
      } catch(err) {
        emptyTip.textContent = "图片加载失败，请稍后刷新";
        console.error(err);
      }
    }
    loadAllImages();
  </script>
</body>
</html>
