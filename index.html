<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>衍星Life</title>
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #342a2a;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            position: relative; 
            z-index: 10;
        }

        h1 {
            font-size: clamp(24px, 8vw, 60px);
            margin-bottom: 2vh;
            font-weight: 600;
        }

        .emoji {
            font-size: clamp(80px, 30vw, 160px);
            color: #7d8797;
            margin-bottom: 20px;
            line-height: 1.2;
            cursor: pointer;
            transition: transform 0.2s, color 0.3s;
            user-select: none;
        }

        .emoji:hover {
            transform: scale(1.1);
        }

        .btn {
            font-weight: 500;
            display: block;
            border: 3px solid #342a2a;
            color: #342a2a;
            margin: 12px auto;
            background-color: #ffffff;
            text-decoration: none;
            font-size: 24px;
            padding: 12px 20px;
            border-radius: 12px;
            transition: all 0.3s ease;
            width: 85%;
            max-width: 400px;
        }

        @media (min-width: 768px) {
            .btn {
                font-size: 32px;
                width: 60%;
                border-width: 5px;
            }
            .emoji { margin-bottom: 30px; }
        }

        @media (min-width: 1024px) {
            .btn {
                font-size: 36px;
                width: 50%;
            }
        }

        .btn:active {
            transform: scale(0.95);
            background-color: #f0f0f0;
        }

        .emoji-trail {
            position: absolute;
            font-size: 30px;
            pointer-events: none;
            z-index: 5;
            animation: trail-fade .6s ease-out forwards;
        }

        @keyframes trail-fade {
            0% { opacity: 1; transform: translate(0, 0) scale(0.7); }
            100% { opacity: 0; transform: translate(0, -40px) rotate(30deg) scale(0.2); }
        }
        /* 仅照片相关按钮，未登录时隐藏 */
        .photo-auth-btn {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>衍星Life</h1>
        <p class="emoji">🥰</p>
        
        <!-- 完全公开，所有人无需登录直接访问 -->
        <a href="randomNumber.html" class="btn">随机数生成器</a>
        <a href="controller.html" class="btn">操控衍星</a>
        <a href="mechabare_detect.html" class="btn">机损特征检测</a>

        <!-- 仅登录后才显示的两个照片功能按钮 -->
        <div class="photo-auth-btn" id="photoBox">
            <a href="/admin/photo-qr" class="btn">路人照片上传</a>
            <a href="/share/gallery" class="btn">最近上传图库</a>
            <a href="javascript:logout()" class="btn" style="border-color:#ff6b9d;color:#ff6b9d;">退出照片权限</a>
        </div>

        <!-- 未登录时只显示这个按钮，跳转到密钥验证页 -->
        <a href="/auth/login" class="btn" id="photoLoginBtn">进入照片上传/图库</a>
    </div>

    <script>
        let isDrawing = false;
        const emojiElement = document.querySelector('.emoji');
        const emojiText = emojiElement.textContent.trim();
        const WORKER_URL = "https://photo-upload-worker.abcd20100234.workers.dev/";

        // 权限判断：只控制照片相关按钮
        function checkAuth() {
            const authFlag = localStorage.getItem("photoSystemAuth");
            const photoBox = document.getElementById("photoBox");
            const photoLoginBtn = document.getElementById("photoLoginBtn");
            if(authFlag === "pass"){
                photoBox.style.display = "block";
                photoLoginBtn.style.display = "none";
            }else{
                photoBox.style.display = "none";
                photoLoginBtn.style.display = "block";
            }
        }
        // 清除照片登录凭证
        function logout(){
            localStorage.removeItem("photoSystemAuth");
            location.reload();
        }

        // 页面初始化校验权限
        checkAuth();

        // 原有emoji拖拽轨迹逻辑完全保留不变
        const toggleDrawing = (e) => {
            e.stopPropagation();
            isDrawing = !isDrawing;
            emojiElement.style.color = isDrawing ? '#ff6b9d' : '#7d8797';
            emojiElement.style.transform = isDrawing ? 'scale(1.1)' : 'scale(1)';
        };

        emojiElement.addEventListener('click', toggleDrawing);
        emojiElement.addEventListener('touchstart', (e) => {});

        function createTrail(x, y) {
            if (!isDrawing) return;
            const trailEmoji = document.createElement('span');
            trailEmoji.className = 'emoji-trail';
            trailEmoji.textContent = emojiText;
            trailEmoji.style.left = `${x - 15}px`;
            trailEmoji.style.top = `${y - 15}px`;
            document.body.appendChild(trailEmoji);
            setTimeout(() => trailEmoji.remove(), 600);
        }

        window.addEventListener('mousemove', (e) => createTrail(e.clientX, e.clientY));
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            createTrail(touch.clientX, touch.clientY);
        }, { passive: true });

        window.addEventListener('click', (e) => {
            if (e.target !== emojiElement && isDrawing) {
                isDrawing = false;
                emojiElement.style.color = '#7d8797';
                emojiElement.style.transform = 'scale(1)';
            }
        });
    </script>
</body>
</html>
