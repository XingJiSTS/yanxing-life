<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片上传生成二维码</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui; }
    .upload-box { border: 2px dashed #999; padding: 60px 20px; text-align: center; cursor: pointer; }
    .upload-box:hover { border-color: #007bff; }
    #file-input { display: none; }
    #preview-box { margin:20px auto;max-width:400px;display:none; }
    #img-preview { width:100%;border-radius:8px;border:2px solid #342a2a; }
    #qrcode { margin: 30px auto; text-align: center; }
    .key-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: center; justify-content: center;
    }
    .modal-inner { background: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; }
    input { width: 100%; padding: 10px; box-sizing: border-box; margin: 10px 0; font-size: 16px; }
    button { padding: 10px 24px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 密钥弹窗 -->
  <div class="key-modal" id="keyModal">
    <div class="modal-inner">
      <h3>请输入上传密钥</h3>
      <input type="text" id="keyInput" placeholder="输入密钥">
      <button onclick="checkKey()">确认</button>
    </div>
  </div>

  <div id="mainContent" class="hidden">
    <h2>上传照片，生成分享二维码</h2>
    <div class="upload-box" onclick="document.getElementById('file-input').click()">
      <p>点击选择图片 / 拖拽图片到此</p>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp">
    </div>
    <!-- 预览框放到mainContent内部，正确位置 -->
    <div id="preview-box">
      <h3>上传图片预览</h3>
      <img id="img-preview">
    </div>
    <div id="qrcode"></div>
  </div>

  <script>
    // ========== 配置区，修改为你自己的信息 ==========
    const WORKER_URL = "https://photo-upload-worker.abcd20100234.workers.dev/";
    const AUTH_KEY = "040403"; // 和Worker代码内密钥保持一致
    // =====================================================

    const keyModal = document.getElementById("keyModal");
    const mainContent = document.getElementById("mainContent");
    const fileInput = document.getElementById("file-input");

    // 读取本地存储的密钥
    const savedKey = localStorage.getItem("uploadKey");
    if (savedKey === AUTH_KEY) {
      keyModal.classList.add("hidden");
      mainContent.classList.remove("hidden");
    }

    // 校验密钥
    function checkKey() {
      const inputVal = document.getElementById("keyInput").value.trim();
      if (inputVal === AUTH_KEY) {
        localStorage.setItem("uploadKey", inputVal);
        keyModal.classList.add("hidden");
        mainContent.classList.remove("hidden");
      } else {
        alert("密钥错误");
      }
    }

    // 选择文件后上传
    fileInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // 本地图片预览逻辑
      const previewBox = document.getElementById("preview-box");
      const imgPreview = document.getElementById("img-preview");
      const reader = new FileReader();
      reader.onload = function(event) {
        imgPreview.src = event.target.result;
        previewBox.style.display = "block";
      }
      reader.readAsDataURL(file);

      if (file.size > 5 * 1024 * 1024) {
        alert("图片不能超过5MB");
        return;
      }
      // 生成随机文件名防止重名
      const ext = file.name.split(".").pop();
      const fileName = Date.now() + "_" + Math.random().toString(36).slice(2) + "." + ext;

      try {
        const res = await fetch(WORKER_URL + fileName, {
          method: "PUT",
          headers: {
            "X-Upload-Key": AUTH_KEY,
            "Content-Type": file.type
          },
          body: file
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data);

        // 生成二维码
        document.getElementById("qrcode").innerHTML = "";
        QRCode.toCanvas(data.url, { width: 300 }, (err, canvas) => {
          if (err) console.error(err);
          document.getElementById("qrcode").appendChild(canvas);
        });
        alert("上传成功！下方二维码可分享给路人");
      } catch (err) {
        console.error(err);
        alert("上传失败：" + err.message);
      }
    });
  </script>
</body>
</html>
