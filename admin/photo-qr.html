<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>照片上传生成二维码</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <style>
    body { max-width: 800px; margin: 40px auto; padding: 0 20px; font-family: system-ui; }
    .upload-box { border: 2px dashed #999; padding: 60px 20px; text-align: center; cursor: pointer; }
    .upload-box:hover { border-color: #007bff; }
    #file-input { display: none; }
    #preview-box { margin:20px auto;max-width:400px;display:none; }
    #img-preview { width:100%;border-radius:8px;border:2px solid #342a2a; }
    #qrcode { margin: 30px auto; text-align: center; }
    .hidden { display: none !important; }
    .tip-text {
      color: #666;
      text-align: center;
      margin: 8px 0 20px;
    }
  </style>
</head>
<body>
  <div id="mainContent">
    <h2>上传照片，生成分享二维码</h2>
    <p class="tip-text">可单选1张生成单图码，多选2张及以上自动生成相册码</p>
    <div class="upload-box" onclick="document.getElementById('file-input').click()">
      <p>点击选择图片 / 拖拽图片到此（支持多选）</p>
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" multiple>
    </div>
    <div id="preview-box">
      <h3>图片预览（首张）</h3>
      <img id="img-preview">
    </div>
    <div id="qrcode"></div>
  </div>

  <script>
    const WORKER_URL = "https://photo.yanxing.life/";
    // 权限校验拦截
    function checkAuth(){
      const authFlag = localStorage.getItem("photoSystemAuth");
      if(authFlag !== "pass"){
        location.href = "/auth/login";
      }
    }
    checkAuth();

    const fileInput = document.getElementById("file-input");

    fileInput.addEventListener("change", async (e) => {
      const fileList = Array.from(e.target.files);
      if (fileList.length === 0) return;

      // 首张图片预览
      const previewBox = document.getElementById("preview-box");
      const imgPreview = document.getElementById("img-preview");
      const reader = new FileReader();
      reader.onload = function(event) {
        imgPreview.src = event.target.result;
        previewBox.style.display = "block";
      }
      reader.readAsDataURL(fileList[0]);

      // 单张/多张区分
      const isAlbum = fileList.length > 1;
      let albumId = "";
      if(isAlbum){
        // 生成相册唯一ID
        albumId = Date.now() + "_" + Math.random().toString(36).slice(2);
      }

      // 限制单张最大5MB
      for(const file of fileList){
        if (file.size > 5 * 1024 * 1024) {
          alert("其中一张图片超过5MB限制");
          return;
        }
      }

      try {
        // 循环上传所有图片
        let shareUrl = "";
        for(const file of fileList){
          const ext = file.name.split(".").pop();
          const fileName = Date.now() + "_" + Math.random().toString(36).slice(2) + "." + ext;
          // 上传图片，携带相册标识
          const res = await fetch(`${WORKER_URL}${fileName}`, {
            method: "PUT",
            headers: {
              "X-Upload-Key": "040403",
              "Content-Type": file.type,
              "X-Album-Id": albumId
            },
            body: file
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data);
          // 仅最后一张记录分享链接
          if(isAlbum){
            shareUrl = `https://yanxing.life/share/album?albumId=${albumId}`;
          }else{
            shareUrl = data.url;
          }
        }

        // 生成二维码
        document.getElementById("qrcode").innerHTML = "";
        QRCode.toCanvas(shareUrl, { width: 300 }, (err, canvas) => {
          if (err) console.error(err);
          document.getElementById("qrcode").appendChild(canvas);
        });
        alert(`上传成功！共${fileList.length}张图，${isAlbum ? '相册二维码' : '单图二维码'}`);
      } catch (err) {
        console.error(err);
        alert("上传失败：" + err.message);
      }
    });
  </script>
</body>
</html>
